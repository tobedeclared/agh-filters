name: Build AdGuard Filters

on:
  workflow_dispatch:

  push:
    branches:
      - config
    paths:
      - "configuration.json"
      - "sources/**"

  schedule:
    # Каждые 3 дня в 03:00 UTC
    - cron: "0 3 */3 * *"

permissions:
  contents: write

concurrency:
  group: build-filters
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout config branch
        uses: actions/checkout@v4
        with:
          ref: config
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install HostlistCompiler
        run: |
          npm install -g @adguard/hostlist-compiler

      - name: Create output directory
        run: mkdir -p output

      - name: Compile filter
        run: |
          hostlist-compiler \
            --config configuration.json \
            --output output/filter.txt

      - name: Generate checksum
        run: |
          sha256sum output/filter.txt > output/filter.txt.sha256

      - name: Generate build info
        run: |
          cat > output/build.txt <<EOF
          Build time: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          Repository: $GITHUB_REPOSITORY
          Source branch: config
          Commit: $GITHUB_SHA
          EOF

      - name: Fetch filters branch
        run: |
          git fetch origin filters || true

      - name: Create worktree
        run: |
          if git ls-remote --exit-code --heads origin filters; then
            git worktree add publish origin/filters
          else
            git worktree add --detach publish
            cd publish
            git checkout --orphan filters
            git rm -rf . >/dev/null 2>&1 || true
          fi

      - name: Copy files
        run: |
          find publish -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            -exec rm -rf {} +

          cp output/* publish/
          touch publish/.nojekyll

      - name: Commit and push
        run: |
          cd publish

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi

          git commit -m "Update filters ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push origin HEAD:filters

      - name: Cleanup
        if: always()
        run: |
          git worktree remove publish --force